<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Objeto Tema</title>
</head>
<body>
    <header>
        <h1>Area de Administrador</h1>
    </header>

    <nav>
        <a href="index.html">Página Inicial</a> | 
        <a href="objeto.html">Objeto-Tema</a> | 
        <a href="usuarios.html">Usuários</a>
    </nav>

    <main>
        <h2>Cadastro / Edição de Objeto-Tema</h2>
        <form>
            <label>Titulo: <input type="text" required></label><br><br>
            <label>Descricao: <textarea required></textarea></label><br><br>
            <button type="submit">Salvar</button>
        </form>

        <h2>Lista de Objetos</h2>
        <table border="1">
            <tr>
                <th>Titulo</th>
                <th>Acoes</th>
            </tr>
            <tr>
                <td>Template de Tema</td>
                <td>
                    <button>Editar</button>
                    <button>Apagar</button>
                </td>
            </tr>
        </table>
    </main>

    <footer>
        <p>Autor: [Nome] | <a href="autor.html">Sobre o autor</a></p>
    </footer>
</body>
</html>
